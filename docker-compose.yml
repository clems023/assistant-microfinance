services:
  db:
    image: pgvector/pgvector:pg16
    container_name: microfinance-db
    environment:
      # Identifiants de DEV uniquement (base locale, donnees fictives). Ne jamais reutiliser.
      POSTGRES_USER: microfinance
      POSTGRES_PASSWORD: microfinance
      POSTGRES_DB: microfinance
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Le schema est applique uniquement a la premiere creation du volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microfinance -d microfinance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
